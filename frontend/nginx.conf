server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API бэкенда: /api/network -> http://backend:8000/api/network (префикс снимает бэкенд).
  # proxy_pass без URI передаёт исходный путь без декодирования — id вида "123%230" не ломаются
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;   # оценка агентов в SUMO может идти несколько минут
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
